<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KlienTrack - Tambah Akun Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary-blue: #0052cc;
        --bg-sidebar: #ffffff;
        --bg-main: #f8faff;
        --bg-card: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --input-bg: #f1f5f9;
        --input-border: transparent;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-main);
      }

      /* Sidebar & Layout */
      .sidebar {
        width: 260px;
        height: 100vh;
        background: var(--bg-sidebar);
        position: fixed;
        padding: 24px;
        border-right: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
      }
      .main-content {
        margin-left: 260px;
        padding: 40px;
      }

      .nav-link {
        color: var(--text-muted);
        font-weight: 500;
        padding: 12px 16px;
        border-radius: 10px;
        text-decoration: none;
        display: flex;
        align-items: center;
        margin-bottom: 4px;
      }
      .nav-link.active {
        background: #e6f0ff;
        color: var(--primary-blue);
      }

      /* Header Profile */
      .profile-circle {
        width: 35px;
        height: 35px;
        background-color: var(--primary-blue);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 13px;
      }

      /* Form Card */
      .form-container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        border: 1px solid #eef2f7;
        max-width: 1000px;
        margin: 0 auto;
      }

      .section-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
        color: #1e293b;
      }
      .section-icon {
        width: 32px;
        height: 32px;
        background: #f0f7ff;
        color: var(--primary-blue);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .form-label {
        font-size: 11px;
        font-weight: 700;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .input-custom {
        background: #f8faff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 14px;
      }

      .profile-widget {
        margin-top: auto;
        background: white;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="d-flex align-items-center mb-4 ps-2">
        <div class="bg-primary p-2 rounded-3 me-2">
          <i class="bi bi-wifi text-white fs-5"></i>
        </div>
        <h5 class="fw-bold mb-0">KlienTrack</h5>
      </div>

      <div class="nav-section-title text-muted small fw-bold mb-2 ps-2">
        MENU UTAMA
      </div>
      <a href="dashboard_manager.html" class="nav-link">
        <i class="bi bi-grid-fill me-3"></i> Dashboard
      </a>

      <div class="nav-section-title text-muted small fw-bold mt-4 mb-2 ps-2">
        LAPORAN
      </div>
      <a href="management_akun.html" class="nav-link active">
        <i class="bi bi-bar-chart-line me-3"></i> Management Akun
      </a>

      <div class="nav-section-title text-muted small fw-bold mt-4 mb-2 ps-2">
        SISTEM
      </div>
      <a href="pengaturan_akun_manager.html" class="nav-link">
        <i class="bi bi-gear me-3"></i> Pengaturan
      </a>

      <div class="profile-widget">
        <div
          id="user-initial"
          class="bg-primary rounded-circle d-flex align-items-center justify-content-center text-white fw-bold"
          style="width: 40px; height: 40px; font-size: 12px"
        >
          --
        </div>
        <div>
          <div id="user-fullname" class="fw-bold small">Memuat...</div>
          <div id="user-role" class="text-muted" style="font-size: 11px">
            Manager
          </div>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="fw-bold mb-0">
          Management Akun /
          <span class="text-muted fw-normal">Tambah Akun Manager</span>
        </h5>
        <div class="d-flex align-items-center gap-3">
          <div class="profile-circle" id="topbar-initial">--</div>
        </div>
      </div>

      <div class="form-container">
        <form id="formTambahManager">
          <div class="section-header">
            <div class="section-icon"><i class="bi bi-person"></i></div>
            <h6 class="fw-bold mb-0">Informasi Profil Akun Manager Baru</h6>
          </div>

          <div class="row g-4 mb-4">
            <div class="col-md-6">
              <label class="form-label">Nama Lengkap</label>
              <input
                type="text"
                class="form-control input-custom"
                id="mgr_fullname"
                placeholder="e.g. Budi Santoso"
                required
              />
            </div>
            <div class="col-md-6">
              <label class="form-label">Username</label>
              <div class="input-group">
                <span
                  class="input-group-text bg-light border-end-0"
                  style="border-radius: 10px 0 0 10px; border-color: #e2e8f0"
                >
                  <i class="bi bi-at text-muted"></i>
                </span>
                <input
                  type="text"
                  class="form-control input-custom border-start-0 ps-0"
                  id="mgr_username"
                  placeholder="manager.budi"
                  required
                />
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label">Email Address</label>
              <input
                type="email"
                class="form-control input-custom"
                id="mgr_email"
                placeholder="budi@klientrack.com"
                required
              />
            </div>
            <div class="col-md-6">
              <label class="form-label">Password</label>
              <div class="input-group">
                <input
                  type="password"
                  class="form-control input-custom border-end-0"
                  id="mgr_password"
                  placeholder="••••••••••••"
                  required
                />
                <span
                  class="input-group-text bg-light border-start-0"
                  style="
                    border-radius: 0 10px 10px 0;
                    border-color: #e2e8f0;
                    cursor: pointer;
                    z-index: 10;
                  "
                  id="togglePassword"
                >
                  <i class="bi bi-eye text-muted" id="eyeIcon"></i>
                </span>
              </div>
              <small class="text-muted mt-2 d-block" style="font-size: 10px"
                >Gunakan minimal 8 karakter dengan kombinasi simbol dan
                angka.</small
              >
            </div>
          </div>

          <div class="d-flex justify-content-end gap-3 mt-5 border-top pt-4">
            <button
              type="button"
              class="btn btn-link text-dark text-decoration-none fw-bold"
              onclick="history.back()"
            >
              Batal
            </button>
            <button
              type="submit"
              class="btn btn-primary px-5 py-2 fw-bold"
              style="border-radius: 10px"
            >
              Simpan Manager Baru
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      // 1. Render Profil User yang sedang login
      document.addEventListener("DOMContentLoaded", function () {
        const userName = localStorage.getItem("user_name") || "Manager";
        const initial = userName.substring(0, 2).toUpperCase();

        document.getElementById("user-fullname").innerText = userName;
        document.getElementById("user-initial").innerText = initial;
        document.getElementById("topbar-initial").innerText = initial;
      });

      // 2. Logika Toggle Password
      const togglePassword = document.querySelector("#togglePassword");
      const passwordInput = document.querySelector("#mgr_password");
      const eyeIcon = document.querySelector("#eyeIcon");

      togglePassword.addEventListener("click", function () {
        const type =
          passwordInput.getAttribute("type") === "password"
            ? "text"
            : "password";
        passwordInput.setAttribute("type", type);
        eyeIcon.classList.toggle("bi-eye");
        eyeIcon.classList.toggle("bi-eye-slash");
      });

      // 3. Logika Submit Form ke API
      document
        .getElementById("formTambahManager")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const requesterId = localStorage.getItem("user_id");
          const btnSubmit = this.querySelector('button[type="submit"]');
          const originalText = btnSubmit.innerHTML;

          btnSubmit.innerHTML = "MEMPROSES...";
          btnSubmit.disabled = true;

          // Payload disesuaikan: Mengambil data langsung dari form
          const payload = {
            username: document.getElementById("mgr_username").value,
            password: document.getElementById("mgr_password").value,
            nama: document.getElementById("mgr_fullname").value,
            // Jika backend DTO Anda mendukung penyimpanan email:
            // email: document.getElementById("mgr_email").value,
            roleId: 1, // PENTING: 1 = Manager (Bukan Admin)
          };

          try {
            const response = await fetchAPI(
              "/api/auth/register",
              "POST",
              payload,
              {
                "X-Requester-Id": requesterId,
              },
            );

            alert(response);
            window.location.href = "management_akun.html";
          } catch (error) {
            alert("Gagal membuat akun Manager: " + error.message);
            btnSubmit.innerHTML = originalText;
            btnSubmit.disabled = false;
          }
        });
    </script>
  </body>
</html>
