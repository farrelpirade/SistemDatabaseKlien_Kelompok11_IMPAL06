<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KlienTrack - Detail Akun</title>
    <script>
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary-blue: #0052cc;
        --bg-sidebar: #f0f4f9;
        --bg-main: #f8faff;
        --text-dark: #1e293b;
        --text-muted: #64748b;
      }

      [data-theme="dark"] {
        --bg-sidebar: #1a1c1e;
        --bg-main: #0f1113;
        --card-bg: #1e2022;
        --text-dark: #f8faff;
        --text-muted: #94a3b8;
        --input-bg: #2d2f31;
        --border-color: #333639;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-main);
        color: var(--text-dark);
        margin: 0;
      }

      /* Sidebar */
      .sidebar {
        width: 260px;
        height: 100vh;
        background: var(--bg-sidebar);
        position: fixed;
        padding: 24px;
        border-right: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
      }
      .main-content {
        margin-left: 260px;
        padding: 40px;
      }

      .nav-link {
        color: var(--text-muted);
        font-weight: 500;
        padding: 12px 16px;
        border-radius: 10px;
        text-decoration: none;
        display: flex;
        align-items: center;
        margin-bottom: 4px;
      }
      .nav-link.active {
        background: #e6f0ff;
        color: var(--primary-blue);
      }

      /* Main Content */
      .main-content {
        margin-left: 260px;
        padding: 40px;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 32px;
      }

      /* Cards */
      .action-card {
        background: white;
        border-radius: 16px;
        padding: 24px;
        border: 1px solid #eef2f7;
        display: flex;
        align-items: flex-start;
        gap: 20px;
        height: 100%;
      }

      .icon-box {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f0f7ff;
        color: var(--primary-blue);
        flex-shrink: 0;
      }

      /* Table */
      .table-container {
        background: white;
        border-radius: 20px;
        padding: 24px;
        margin-top: 32px;
        border: 1px solid #eef2f7;
      }

      .table thead th {
        background-color: #f8faff;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        padding: 15px 20px;
        border: none;
      }

      /* Profile Widget */
      .profile-widget {
        margin-top: auto;
        background: white;
        padding: 12px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="d-flex align-items-center mb-4 ps-2">
        <div class="bg-primary p-2 rounded-3 me-2">
          <i class="bi bi-wifi text-white fs-5"></i>
        </div>
        <h5 class="fw-bold mb-0">KlienTrack</h5>
      </div>

      <div class="nav-section-title">Menu Utama</div>
      <a href="dashboard_manager.html" class="nav-link"
        ><i class="bi bi-grid-fill me-3"></i> Dashboard</a
      >

      <div class="nav-section-title">Laporan</div>
      <a href="management_akun.html" class="nav-link active"
        ><i class="bi bi-bar-chart-line me-3"></i> Management Akun</a
      >

      <div class="nav-section-title">Sistem</div>
      <a href="pengaturan_akun_manager.html" class="nav-link"
        ><i class="bi bi-gear me-3"></i> Pengaturan</a
      >

      <div class="profile-widget">
        <div
          id="logged-user-initial"
          class="bg-primary rounded-circle d-flex align-items-center justify-content-center text-white fw-bold"
          style="width: 40px; height: 40px; font-size: 12px"
        >
          --
        </div>
        <div>
          <div id="logged-user-name" class="fw-bold small">Memuat...</div>
          <div class="text-muted" style="font-size: 11px">Manager</div>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-5">
        <h4 class="fw-bold mb-0">Detail Akun</h4>
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-light rounded-pill border">
            <i class="bi bi-bell"></i>
          </button>
          <div
            id="user-header-initial"
            class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold"
            style="width: 35px; height: 35px; font-size: 13px"
          >
            --
          </div>
        </div>
      </div>

      <div class="form-container">
        <div class="fs-5 fw-bold mb-4" style="color: var(--text-dark)">
          Detail Akun
        </div>

        <form id="formEditDetailAkun" onsubmit="saveAccountChanges(event)">
          <div class="mb-4">
            <div class="custom-label">Username</div>
            <div class="custom-input-group">
              <i class="bi bi-person"></i>
              <input
                type="text"
                class="form-control"
                id="edit_username"
                value="Andi Saputra"
                required
              />
            </div>
          </div>

          <div class="mb-4">
            <div class="custom-label">Password</div>
            <div class="custom-input-group">
              <i class="bi bi-lock"></i>
              <input
                type="text"
                class="form-control"
                id="edit_password"
                value="andi.s@klientrack.id"
                required
              />
            </div>
          </div>

          <div class="d-flex justify-content-end align-items-center gap-3 mt-5">
            <a
              href="management_akun.html"
              class="text-decoration-none text-muted small fw-semibold px-2"
              >Batal</a
            >
            <button
              type="submit"
              class="btn btn-primary px-4 fw-bold"
              style="
                border-radius: 10px;
                background-color: var(--primary-blue);
                font-size: 14px;
                padding-top: 10px;
                padding-bottom: 10px;
              "
            >
              Update
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      // 1. Ambil ID dari URL
      const urlParams = new URLSearchParams(window.location.search);
      const targetUserId = urlParams.get("id");

      document.addEventListener("DOMContentLoaded", async function () {
        const loggedInUser = localStorage.getItem("user_name") || "Manager";
        document.getElementById("logged-user-name").innerText = loggedInUser;
        document.getElementById("logged-user-initial").innerText = loggedInUser
          .substring(0, 2)
          .toUpperCase();
        document.getElementById("user-header-initial").innerText = loggedInUser
          .substring(0, 2)
          .toUpperCase();

        if (!targetUserId) {
          alert("ID Staf tidak ditemukan!");
          window.location.href = "management_akun.html";
          return;
        }

        // 2. Fetch data lama untuk mengisi form
        try {
          const users = await fetchAPI("/api/auth/users", "GET");
          const targetUser = users.find((u) => u.userId == targetUserId);

          if (targetUser) {
            document.getElementById("edit_username").value = targetUser.nama;
            // Sengaja dikosongkan agar admin tidak melihat hash password
            document.getElementById("edit_password").value = "";
            document.getElementById("edit_password").placeholder =
              "Ketik password baru (opsional)";
          }
        } catch (error) {
          console.error("Gagal memuat detail akun:", error);
        }
      });

      // 3. Simpan Perubahan (PUT API)
      async function saveAccountChanges(event) {
        event.preventDefault();

        const btnSubmit = document.querySelector('button[type="submit"]');
        const originalText = btnSubmit.innerHTML;
        btnSubmit.innerHTML = "Menyimpan...";
        btnSubmit.disabled = true;

        const payload = {
          nama: document.getElementById("edit_username").value,
          password: document.getElementById("edit_password").value, // Kosong berarti tidak ubah pass
        };

        try {
          await fetchAPI(`/api/auth/users/${targetUserId}`, "PUT", payload);
          alert("Data akun berhasil diperbarui!");
          window.location.href = "management_akun.html";
        } catch (error) {
          alert("Gagal update: " + error.message);
          btnSubmit.innerHTML = originalText;
          btnSubmit.disabled = false;
        }
      }
    </script>
  </body>
</html>
