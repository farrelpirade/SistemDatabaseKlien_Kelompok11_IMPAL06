<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KlienTrack - Detail Akun</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary-blue: #0052cc;
        --bg-sidebar: #ffffff;
        --bg-main: #f8faff;
        --bg-card: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        margin: 0;
      }

      .sidebar {
        width: 260px;
        height: 100vh;
        background: var(--bg-sidebar);
        position: fixed;
        padding: 24px;
        border-right: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
      }
      .main-content {
        margin-left: 260px;
        padding: 40px;
      }

      .nav-link {
        color: var(--text-muted);
        font-weight: 500;
        padding: 12px 16px;
        border-radius: 10px;
        text-decoration: none;
        display: flex;
        align-items: center;
        margin-bottom: 4px;
      }
      .nav-link.active {
        background: #e6f0ff;
        color: var(--primary-blue);
      }

      .form-container {
        background: white;
        border-radius: 20px;
        padding: 32px;
        border: 1px solid #eef2f7;
        max-width: 800px;
      }

      .profile-widget {
        margin-top: auto;
        background: white;
        padding: 12px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="d-flex align-items-center mb-4 ps-2">
        <div class="bg-primary p-2 rounded-3 me-2">
          <i class="bi bi-wifi text-white fs-5"></i>
        </div>
        <h5 class="fw-bold mb-0">KlienTrack</h5>
      </div>

      <div class="nav-section-title text-muted small fw-bold mb-2 ps-2">
        MENU UTAMA
      </div>
      <a href="dashboard_manager.html" class="nav-link"
        ><i class="bi bi-grid-fill me-3"></i> Dashboard</a
      >

      <div class="nav-section-title text-muted small fw-bold mt-4 mb-2 ps-2">
        LAPORAN
      </div>
      <a href="management_akun.html" class="nav-link active"
        ><i class="bi bi-bar-chart-line me-3"></i> Management Akun</a
      >

      <div class="nav-section-title text-muted small fw-bold mt-4 mb-2 ps-2">
        SISTEM
      </div>
      <a href="pengaturan_akun_manager.html" class="nav-link"
        ><i class="bi bi-gear me-3"></i> Pengaturan</a
      >

      <div class="profile-widget">
        <div
          id="logged-user-initial"
          class="bg-primary rounded-circle d-flex align-items-center justify-content-center text-white fw-bold"
          style="width: 40px; height: 40px; font-size: 12px"
        >
          --
        </div>
        <div>
          <div id="logged-user-name" class="fw-bold small">Memuat...</div>
          <div class="text-muted" style="font-size: 11px">Manager</div>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-5">
        <h4 class="fw-bold mb-0">Detail Akun</h4>
        <div
          id="user-header-initial"
          class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold"
          style="width: 35px; height: 35px; font-size: 13px"
        >
          --
        </div>
      </div>

      <div class="form-container">
        <div class="fs-5 fw-bold mb-4">Edit Profil Staf</div>

        <form id="formEditDetailAkun" onsubmit="saveAccountChanges(event)">
          <div class="mb-4">
            <div
              class="text-muted small fw-bold text-uppercase mb-2"
              style="letter-spacing: 0.5px"
            >
              Nama Lengkap
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"
                ><i class="bi bi-person text-muted"></i
              ></span>
              <input
                type="text"
                class="form-control border-start-0 ps-0 bg-light"
                id="edit_nama"
                required
              />
            </div>
          </div>

          <div class="mb-4">
            <div
              class="text-muted small fw-bold text-uppercase mb-2"
              style="letter-spacing: 0.5px"
            >
              Username (Identitas Login)
            </div>
            <div class="input-group">
              <span
                class="input-group-text"
                style="
                  background-color: #e2e8f0;
                  border-color: #cbd5e1;
                  border-right: none;
                "
              >
                <i class="bi bi-at text-secondary"></i>
              </span>
              <input
                type="text"
                class="form-control text-secondary"
                id="edit_username_login"
                style="
                  background-color: #f1f5f9;
                  border-color: #cbd5e1;
                  border-left: none;
                "
                disabled
              />
            </div>
            <small class="text-muted mt-1 d-block" style="font-size: 11px"
              >Username adalah kunci login dan tidak dapat diubah.</small
            >
          </div>

          <div class="mb-5">
            <div
              class="text-muted small fw-bold text-uppercase mb-2"
              style="letter-spacing: 0.5px"
            >
              Password Baru
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"
                ><i class="bi bi-lock text-muted"></i
              ></span>
              <input
                type="password"
                class="form-control border-start-0 ps-0 bg-light"
                id="edit_password"
                placeholder="Kosongkan jika tidak ingin mengubah password"
              />
            </div>
          </div>

          <div class="d-flex justify-content-end align-items-center gap-3 mt-4">
            <a
              href="management_akun.html"
              class="text-decoration-none text-muted small fw-semibold px-2"
              >Batal</a
            >
            <button
              type="submit"
              class="btn btn-primary px-4 fw-bold"
              style="border-radius: 10px; padding: 10px 20px"
            >
              Update Akun
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const targetUserId = urlParams.get("id");

      document.addEventListener("DOMContentLoaded", async function () {
        // 1. Tampilkan Profil yang sedang Login
        const loggedInUser = localStorage.getItem("user_name") || "Manager";
        const initial = loggedInUser.substring(0, 2).toUpperCase();

        document.getElementById("logged-user-name").innerText = loggedInUser;
        document.getElementById("logged-user-initial").innerText = initial;
        document.getElementById("user-header-initial").innerText = initial;

        // Validasi ID Staf
        if (!targetUserId) {
          alert("ID Staf tidak ditemukan!");
          window.location.href = "management_akun.html";
          return;
        }

        // 2. Fetch Data Lama dari Database
        try {
          const users = await fetchAPI("/api/auth/users", "GET");
          const targetUser = users.find((u) => u.userId == targetUserId);

          if (targetUser) {
            // Isi otomatis form berdasarkan data database
            document.getElementById("edit_nama").value = targetUser.nama;
            document.getElementById("edit_username_login").value =
              targetUser.username;
            document.getElementById("edit_password").value = "";
          } else {
            alert("Data staf tidak ditemukan.");
            window.location.href = "management_akun.html";
          }
        } catch (error) {
          console.error("Gagal memuat detail akun:", error);
          alert("Gagal terhubung ke server.");
        }
      });

      // 3. Simpan Perubahan (PUT API)
      async function saveAccountChanges(event) {
        event.preventDefault();

        const btnSubmit = document.querySelector('button[type="submit"]');
        const originalText = btnSubmit.innerHTML;
        btnSubmit.innerHTML = "Menyimpan...";
        btnSubmit.disabled = true;

        const passwordVal = document.getElementById("edit_password").value;

        const payload = {
          nama: document.getElementById("edit_nama").value,
          password: passwordVal.trim() === "" ? null : passwordVal,
        };

        try {
          await fetchAPI(`/api/auth/users/${targetUserId}`, "PUT", payload);
          alert("Data akun berhasil diperbarui!");
          window.location.href = "management_akun.html";
        } catch (error) {
          alert("Gagal update: " + error.message);
          btnSubmit.innerHTML = originalText;
          btnSubmit.disabled = false;
        }
      }
    </script>
  </body>
</html>
