<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KlienTrack - Edit Detail Klien</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- PALET WARNA LIGHT MODE --- */
      :root {
        --primary-blue: #0052cc;
        --bg-sidebar: #ffffff;
        --bg-main: #f8faff;
        --bg-card: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --input-bg: #f1f5f9;
        --input-border: transparent;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-main);
        margin: 0;
        color: var(--text-main);
      }

      /* --- SIDEBAR --- */
      .sidebar {
        width: 260px;
        height: 100vh;
        background: var(--bg-sidebar);
        position: fixed;
        padding: 24px;
        border-right: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
      }
      .nav-link {
        color: var(--text-muted);
        font-weight: 500;
        padding: 12px 16px;
        border-radius: 10px;
        text-decoration: none;
        display: flex;
        align-items: center;
        margin-bottom: 4px;
      }
      .nav-link.active {
        background: #e6f0ff;
        color: var(--primary-blue);
      }

      .profile-widget {
        margin-top: auto;
        background: white;
        padding: 12px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid #e2e8f0;
      }

      /* --- MAIN CONTENT --- */
      .main-content {
        margin-left: 260px;
        padding: 40px;
      }

      .profile-circle-sm {
        width: 35px;
        height: 35px;
        background: var(--primary-blue);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 12px;
      }

      /* --- FORM CARD --- */
      .content-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        border: 1px solid #eef2f7;
        max-width: 800px;
      }

      .form-label-custom {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .input-custom {
        background: #f1f5f9;
        border: 1px solid transparent;
        border-radius: 12px;
        padding: 14px 18px;
        font-size: 14px;
        color: var(--text-main);
      }

      .input-custom:focus {
        background: white;
        border-color: var(--primary-blue);
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="d-flex align-items-center mb-2 ps-2">
        <div class="bg-primary p-2 rounded-3 me-2">
          <i class="bi bi-wifi text-white fs-5"></i>
        </div>
        <h5 class="fw-bold mb-0">KlienTrack</h5>
      </div>

      <div
        class="nav-section-title mt-4 mb-2 ps-2 text-muted"
        style="font-size: 11px; font-weight: 700; text-transform: uppercase"
      >
        Menu Utama
      </div>
      <a href="dashboard_admin.html" class="nav-link">
        <i class="bi bi-grid-fill me-3"></i> Dashboard
      </a>
      <a href="daftar_client_admin.html" class="nav-link active">
        <i class="bi bi-people me-3"></i> Daftar Klien
      </a>
      <a href="kontrak_admin.html" class="nav-link">
        <i class="bi bi-file-earmark-text me-3"></i> Kontrak
      </a>
      <a href="paket_layanan_admin.html" class="nav-link">
        <i class="bi bi-box-seam me-3"></i> Paket Layanan
      </a>

      <div
        class="nav-section-title mt-4 mb-2 ps-2 text-muted"
        style="font-size: 11px; font-weight: 700; text-transform: uppercase"
      >
        Sistem
      </div>
      <a href="pengaturan_akun_admin.html" class="nav-link">
        <i class="bi bi-gear me-3"></i> Pengaturan
      </a>

      <div class="profile-widget">
        <div
          class="bg-primary rounded-circle d-flex align-items-center justify-content-center text-white fw-bold"
          style="width: 40px; height: 40px; font-size: 12px"
        >
          --
        </div>
        <div>
          <div class="fw-bold small">Memuat...</div>
          <div class="text-muted" style="font-size: 11px">Administrator</div>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-5">
        <div class="d-flex align-items-center gap-2">
          <span class="text-muted small">Daftar Klien</span>
          <i class="bi bi-chevron-right text-muted" style="font-size: 10px"></i>
          <span class="small fw-bold">Edit Klien</span>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="profile-circle-sm" id="header_initial_top">--</div>
        </div>
      </div>

      <div class="mb-4">
        <h2 class="fw-bold mb-1">Edit Informasi Klien</h2>
        <p class="text-muted small">
          Perbarui data kontak dan identitas pelanggan di bawah ini.
        </p>
      </div>

      <div class="content-card">
        <form id="formEditKlien">
          <div class="mb-4">
            <label class="form-label-custom">Nama Lengkap Klien</label>
            <input
              type="text"
              class="form-control input-custom"
              id="edit_nama_klien"
              placeholder="e.g. Bapak Ridwan"
              required
            />
          </div>

          <div class="row g-4 mb-4">
            <div class="col-md-6">
              <label class="form-label-custom">Email</label>
              <input
                type="email"
                class="form-control input-custom"
                id="edit_email_klien"
                placeholder="nama@email.com"
                required
              />
            </div>
            <div class="col-md-6">
              <label class="form-label-custom">Nomor Telepon (WhatsApp)</label>
              <input
                type="text"
                class="form-control input-custom"
                id="edit_telepon_klien"
                placeholder="081234567890"
                required
              />
            </div>
          </div>

          <div class="mb-5">
            <label class="form-label-custom">Alamat Lengkap</label>
            <textarea
              class="form-control input-custom"
              id="edit_alamat_klien"
              rows="3"
              placeholder="Masukkan alamat lengkap instalasi"
              required
            ></textarea>
          </div>

          <div class="d-flex gap-3 mt-5">
            <button
              type="submit"
              class="btn btn-primary px-5 py-3 fw-bold"
              style="border-radius: 12px; font-size: 14px"
            >
              Simpan Perubahan
            </button>
            <button
              type="button"
              onclick="history.back()"
              class="btn btn-light px-5 py-3 fw-bold border"
              style="border-radius: 12px; font-size: 14px; background: white"
            >
              Batal
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const klienId = urlParams.get("id");

      document.addEventListener("DOMContentLoaded", async function () {
        // Render Profile di Sidebar/Topbar
        const userName = localStorage.getItem("user_name") || "Admin";
        document.getElementById("header_initial_top").innerText = userName
          .substring(0, 2)
          .toUpperCase();
        document.querySelector(".profile-widget .bg-primary").innerText =
          userName.substring(0, 2).toUpperCase();
        document.querySelector(".profile-widget .fw-bold.small").innerText =
          userName;

        if (!klienId) {
          alert("ID Klien tidak valid!");
          window.location.href = "daftar_client_admin.html";
          return;
        }

        // Fetch Data Lama untuk mengisi form
        try {
          const data = await fetchAPI(`/api/klien/${klienId}`, "GET");

          document.getElementById("edit_nama_klien").value = data.namaKlien;
          document.getElementById("edit_email_klien").value = data.email || "";
          document.getElementById("edit_telepon_klien").value = data.noTelepon;
          document.getElementById("edit_alamat_klien").value = data.alamat;
        } catch (error) {
          alert("Gagal memuat detail klien: " + error.message);
          window.location.href = "daftar_client_admin.html";
        }
      });

      // Event Submit Form untuk PUT Update
      document
        .getElementById("formEditKlien")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const btnSubmit = this.querySelector('button[type="submit"]');
          const originalText = btnSubmit.innerHTML;
          btnSubmit.innerHTML = "Menyimpan...";
          btnSubmit.disabled = true;

          const payload = {
            namaKlien: document.getElementById("edit_nama_klien").value,
            email: document.getElementById("edit_email_klien").value,
            noTelepon: document.getElementById("edit_telepon_klien").value,
            alamat: document.getElementById("edit_alamat_klien").value,
            // createdBy diperlukan oleh DTO, kita ambil dari localStorage
            createdBy: parseInt(localStorage.getItem("user_id")) || 1,
          };

          try {
            await fetchAPI(`/api/klien/${klienId}`, "PUT", payload);
            alert("Perubahan data klien berhasil disimpan!");
            // Kembali ke halaman detail klien yang bersangkutan
            window.location.href = `detail_client_admin.html?id=${klienId}`;
          } catch (error) {
            alert("Gagal mengupdate klien: " + error.message);
            btnSubmit.innerHTML = originalText;
            btnSubmit.disabled = false;
          }
        });
    </script>
  </body>
</html>
